name: sync-vault

# "on:" is a YAML 1.1 boolean — quote it to stay explicit.
"on":
  # Every 6 hours — pick up vault changes with a small delay.
  schedule:
    - cron: "0 */6 * * *"
  # Manual trigger for testing or out-of-band syncs.
  workflow_dispatch:

env:
  # Configurable via Settings → Secrets and variables → Actions → Variables.
  # Workflow inputs (workflow_dispatch) override them.
  VAULT_REPO: ${{ vars.VAULT_REPO || 'ansango/ansango.vault' }}
  VAULT_REF: ${{ vars.VAULT_REF || '' }}
  VAULT_MANIFEST: ${{ vars.VAULT_MANIFEST || '1.projects/ansango/readme/books.md' }}
  VAULT_DIR: ${{ vars.VAULT_DIR || 'vault' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout readme
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.README_TOKEN }}

      - name: checkout vault
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VAULT_REPO }}
          ref: ${{ env.VAULT_REF || '' }}
          path: ${{ env.VAULT_DIR }}
          token: ${{ secrets.VAULT_TOKEN }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install deps
        run: npm ci

      - name: sync books
        run: |
          node tools/sync-vault/index.mjs \
            --manifest "${{ env.VAULT_DIR }}/${{ env.VAULT_MANIFEST }}" \
            --vault "${{ env.VAULT_DIR }}" \
            --out src/content

      - name: capture vault sha
        if: always()
        run: echo "VAULT_SHA=$(git -C "${{ env.VAULT_DIR }}" rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.README_TOKEN }}
          branch: chore/sync-vault
          delete-branch: true
          commit-message: "chore(sync): vault @ ${{ env.VAULT_SHA }}"
          title: "Sync from vault"
          add-paths: |
            src/content
            .sync-stamp
          body: |
            Auto-generated sync from [`${{ env.VAULT_REPO }}`](https://github.com/${{ env.VAULT_REPO }}).

            - Vault SHA: `${{ env.VAULT_SHA }}`
            - Manifest: `${{ env.VAULT_MANIFEST }}`
            - Trigger: `${{ github.event_name }}`
